<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Faculty - IT-SALMS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #29264c;
        }

        .container {
            width: 700px;
            max-width: 95%;
            margin: 40px auto;
        }

        .card {
            background: white;
            border: 1px solid #e7e6ee;
            border-radius: 12px;
            padding: 30px;
        }

        h2 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dcdbe5;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5632d5;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            border: none;
            background: #5632d5;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
            cursor: pointer;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #eeeeee;
            color: #444;
            padding: 10px 18px;
            border-radius: 7px;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>Edit Faculty</h2>

        <p class="subtitle">
            Update faculty information
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="full_name"
                    value="{{ faculty.full_name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Employee ID</label>

                <input
                    type="text"
                    name="employee_id"
                    value="{{ faculty.employee_id }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Designation</label>

                <input
                    type="text"
                    name="designation"
                    value="{{ faculty.designation }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ faculty.email }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Mobile</label>

                <input
                    type="text"
                    name="mobile"
                    value="{{ faculty.mobile }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option value="Active"
                        {% if faculty.status == "Active" %}selected{% endif %}>
                        Active
                    </option>

                    <option value="Inactive"
                        {% if faculty.status == "Inactive" %}selected{% endif %}>
                        Inactive
                    </option>

                </select>

            </div>


            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a href="{% url 'manage_faculty' %}" class="back-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
