{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Faculty - IT-SALMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #29264c;
        }

        .container {
            width: 650px;
            max-width: 95%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e7e6ee;
        }

        h2 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d8d6e2;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5632d5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        .save-btn {
            background: #5632d5;
            color: white;
        }

        .cancel-btn {
            background: #eeeeee;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Add Faculty</h2>

        <p class="subtitle">
            Add a new faculty member to the IT Department
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Employee ID -->
            <div class="form-group">

                <label for="employee_id">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="employee_id"
                    name="employee_id"
                    placeholder="Enter employee ID"
                    value="{{ employee_id|default:'' }}"
                    required
                >

            </div>


            <!-- Full Name -->
            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter full name"
                    value="{{ full_name|default:'' }}"
                    required
                >

            </div>


            <!-- Designation -->
            <div class="form-group">

                <label for="designation">
                    Designation
                </label>

                <input
                    type="text"
                    id="designation"
                    name="designation"
                    placeholder="e.g. Assistant Professor"
                    value="{{ designation|default:'' }}"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    value="{{ email|default:'' }}"
                    required
                >

            </div>


            <!-- Mobile -->
            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter mobile number"
                    value="{{ mobile|default:'' }}"
                >

            </div>


            <!-- Status -->
            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status" name="status">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                    type="submit"
                    class="btn save-btn">
                    Add Faculty
                </button>

                <a
                    href="{% url 'manage_faculty' %}"
                    class="btn cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
